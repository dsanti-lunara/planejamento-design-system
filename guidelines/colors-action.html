<!-- @dsCard group="Colors" viewport="700x150" name="Action & Brand" subtitle="primary action blue, brand red, hover/pressed states" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;padding:16px;background:var(--color-surface-page);font-family:var(--font-sans);flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:40px;border-radius:8px;background:var(--color-action-primary)"></div><span style="font-size:8px;color:var(--color-text-muted)">action/primary</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:40px;border-radius:8px;background:var(--color-action-primary-hover)"></div><span style="font-size:8px;color:var(--color-text-muted)">hover</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:40px;border-radius:8px;background:var(--color-action-primary-pressed)"></div><span style="font-size:8px;color:var(--color-text-muted)">pressed</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:40px;border-radius:8px;background:var(--brand-500)"></div><span style="font-size:8px;color:var(--color-text-muted)">brand (Claro red)</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:40px;border-radius:8px;background:var(--color-action-disabled)"></div><span style="font-size:8px;color:var(--color-text-muted)">disabled</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:40px;border-radius:8px;background:var(--color-action-secondary);box-shadow:inset 0 0 0 1px var(--color-action-secondary-border)"></div><span style="font-size:8px;color:var(--color-text-muted)">secondary</span></div>
</div>
