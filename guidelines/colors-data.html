<!-- @dsCard group="Colors" viewport="700x150" name="Data & Semantic States" subtitle="positive, negative, attention, plan, series 1-4 — never the only signal" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;padding:16px;background:var(--color-surface-page);font-family:var(--font-sans);flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-positive)"></div><span style="font-size:8px;color:var(--color-text-muted)">positive</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-negative)"></div><span style="font-size:8px;color:var(--color-text-muted)">negative</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-attention)"></div><span style="font-size:8px;color:var(--color-text-muted)">attention</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-plan)"></div><span style="font-size:8px;color:var(--color-text-muted)">plan</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-critical-band)"></div><span style="font-size:8px;color:var(--color-text-muted)">critical band</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-series-1)"></div><span style="font-size:8px;color:var(--color-text-muted)">series 1</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-series-2)"></div><span style="font-size:8px;color:var(--color-text-muted)">series 2</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-series-3)"></div><span style="font-size:8px;color:var(--color-text-muted)">series 3</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:56px;height:36px;border-radius:6px;background:var(--color-data-series-4)"></div><span style="font-size:8px;color:var(--color-text-muted)">series 4</span></div>
</div>
