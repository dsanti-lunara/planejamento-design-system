<!-- @dsCard group="Colors" viewport="700x160" name="Surface" subtitle="canvas, card, sidebar, header, subtle, selected" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:0;height:100px;font-family:var(--font-sans)">
<div style="flex:1;background:var(--color-surface-canvas);display:flex;align-items:flex-end;padding:6px;font-size:9px;color:var(--color-text-secondary)">canvas</div>
<div style="flex:1;background:var(--color-surface-card);box-shadow:inset 0 0 0 1px var(--color-border-default);display:flex;align-items:flex-end;padding:6px;font-size:9px;color:var(--color-text-secondary)">card</div>
<div style="flex:1;background:var(--color-surface-subtle);display:flex;align-items:flex-end;padding:6px;font-size:9px;color:var(--color-text-secondary)">subtle</div>
<div style="flex:1;background:var(--color-surface-selected);display:flex;align-items:flex-end;padding:6px;font-size:9px;color:var(--color-text-secondary)">selected</div>
<div style="flex:1;background:var(--color-surface-header);box-shadow:inset 0 0 0 1px var(--color-border-default);display:flex;align-items:flex-end;padding:6px;font-size:9px;color:var(--color-text-secondary)">header</div>
<div style="flex:1;background:var(--color-surface-sidebar);box-shadow:inset 0 0 0 1px var(--color-border-default);display:flex;align-items:flex-end;padding:6px;font-size:9px;color:var(--color-text-secondary)">sidebar</div>
<div style="flex:1;background:var(--color-surface-sidebar);display:flex;align-items:flex-end;padding:6px;font-size:9px;color:#fff">nav (inverse)</div>
</div>
