<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Admin · Comunicados (lista)" description="Rota /admin/comunicados — gerencia avisos exibidos aos usuários do Nexo. Filtro por status, KPIs, tabela; abre /admin/comunicados/novo e /admin/comunicados/:noticeId." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:100%;height:100vh;overflow:hidden;background:var(--color-surface-canvas);display:flex;flex-direction:row;align-items:stretch;font-family:var(--font-sans);box-sizing:border-box">
<div style="display:grid;grid-template-rows:minmax(0,1fr) auto;flex-shrink:0;height:100%;overflow:hidden;background:var(--color-surface-sidebar);box-shadow:inset 0 0 0 1px var(--color-border-subtle)">
<x-import component-from-global-scope="DesignSystem_25dd5c.NavSidebar" items="{{ sidebarItems }}" logo="{{ sidebarLogo }}" collapsed="{{ sidebarCollapsed }}" onToggleCollapsed="{{ toggleSidebarCollapsed }}" show-back-to-portal="{{ false }}" show-utility="{{ false }}" bordered="{{ false }}" style="height:100%" hint-size="222px,auto"></x-import>
<div onclick="{{ handleLogout }}" style="display:flex;align-items:center;gap:12px;height:40px;padding:12px 12px 12px 16px;margin:0 12px 12px;border-radius:8px;cursor:pointer;box-sizing:border-box;flex-shrink:0" style-hover="background:var(--color-action-hover)">
<span style="font-family:var(--font-sans);font-weight:500;font-size:14px;color:var(--color-text-secondary)">{{ logoutLabel }}</span>
</div>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-start;flex-grow:1;width:100%;max-width:100%;height:100%;overflow:hidden;min-width:0">
<x-import component-from-global-scope="DesignSystem_25dd5c.NavTopbar" variant="admin" search="{{ true }}" onSearchClick="{{ noop }}" notifications="{{ true }}" user="{{ topbarUser }}" style="flex-shrink:0;width:100%" hint-size="100%,56px"></x-import>

<div style="display:flex;flex-direction:column;gap:14px;padding:20px 24px;align-items:stretch;box-sizing:border-box;flex-grow:1;align-self:stretch;width:100%;max-width:100%;overflow-y:auto;overflow-x:hidden;min-width:0">

<x-import component-from-global-scope="DesignSystem_25dd5c.AdminPageHeader" title="Comunicados" description="Gerencie avisos e mensagens exibidos aos usuários do Nexo." primaryAction="{{ true }}" primaryLabel="Novo comunicado" onPrimaryAction="{{ goNovo }}" style="width:100%;height:auto" hint-size="100%,72px"></x-import>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;min-width:0">
<x-import component-from-global-scope="DesignSystem_25dd5c.AdminSummaryKPICard" label="Ativos" value="{{ kpiActive }}" secondary="{{ kpiActiveSecondary }}" secondaryTone="positive" style="width:100%;height:auto" hint-size="100%,96px"></x-import>
<x-import component-from-global-scope="DesignSystem_25dd5c.AdminSummaryKPICard" label="Agendados" value="{{ kpiScheduled }}" secondary="{{ kpiScheduledSecondary }}" secondaryTone="info" style="width:100%;height:auto" hint-size="100%,96px"></x-import>
<x-import component-from-global-scope="DesignSystem_25dd5c.AdminSummaryKPICard" label="Encerrando em breve" value="{{ kpiEnding }}" secondary="{{ kpiEndingSecondary }}" secondaryTone="warning" style="width:100%;height:auto" hint-size="100%,96px"></x-import>
</div>

<x-import component-from-global-scope="DesignSystem_25dd5c.AdminFilterBar" showSearch="{{ true }}" searchPlaceholder="Buscar por título" searchValue="{{ filters.search }}" onSearchChange="{{ onSearchChange }}" showStatus="{{ true }}" statusLabel="Status" statusOptions="{{ statusOptions }}" statusValue="{{ filters.status }}" onStatusChange="{{ onStatusChange }}" showProduct="{{ true }}" productLabel="Tipo" productOptions="{{ typeOptions }}" productValue="{{ filters.type }}" onProductChange="{{ onTypeChange }}" showPeriod="{{ false }}" activeFilters="{{ hasActiveFilters }}" activeFilterChips="{{ activeFilterChips }}" clearFilters="{{ hasActiveFilters }}" onClearFilters="{{ clearFilters }}" style="width:100%" hint-size="100%,64px"></x-import>

<sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="DesignSystem_25dd5c.DataTable" columns="{{ columns }}" rows="{{ filteredRows }}" rowKey="{{ rowKey }}" onRowClick="{{ onRowClick }}" hoverable="{{ true }}" density="standard" stickyHeader="{{ true }}" style="width:100%" hint-size="100%,420px"></x-import>
</sc-if>
<sc-if value="{{ !hasResults }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="DesignSystem_25dd5c.DataDataState" type="noresults" text1="Nenhum comunicado encontrado" text2="Ajuste os filtros ou crie um novo comunicado." style="width:100%" hint-size="100%,240px"></x-import>
</sc-if>

</div>
</div>
</div>


</x-dc>
<script type="text/x-dc" data-dc-script>
const STATUS_TONE = { 'Ativo': 'positive', 'Agendado': 'info', 'Encerrado': 'neutral', 'Rascunho': 'warning' };
const TYPE_TONE = { 'Informação': 'info', 'Novidade': 'positive', 'Manutenção': 'warning' };
const AUDIENCE_LABEL = (n) => {
  if (n.audienceMode === 'todos') return 'Todos os usuários';
  if (n.audienceMode === 'categorias') return (n.categories || []).length + ' categoria(s)';
  if (n.audienceMode === 'produtos') return (n.products || []).length + ' produto(s)';
  return '—';
};
const VIGENCIA_LABEL = (n) => {
  const start = n.startDate ? n.startDate.split('-').reverse().join('/') : '—';
  const end = n.noEndDate ? 'sem encerramento' : (n.endDate ? n.endDate.split('-').reverse().join('/') : '—');
  return start + ' – ' + end;
};

class Component extends DCLogic {
  state = {
    sidebarCollapsed: false,
    notices: [
      { id: 'painel-clientes-v2', title: 'Nova versão do Painel de Clientes', type: 'Novidade', audienceMode: 'produtos', products: ['Painel de Clientes'], startDate: '2026-08-24', endDate: '2026-09-07', noEndDate: false, status: 'Ativo', updatedBy: 'Ana Ferreira', updatedAt: '24/08/2026 09:10' },
      { id: 'manutencao-nexo', title: 'Manutenção programada do Nexo', type: 'Manutenção', audienceMode: 'todos', startDate: '2026-08-30', startTime: '22:00', endDate: '2026-08-31', endTime: '02:00', noEndDate: false, status: 'Agendado', updatedBy: 'Bruno Costa', updatedAt: '25/08/2026 16:40' },
      { id: 'nova-categoria-dados', title: 'Nova categoria Dados & Inteligência', type: 'Informação', audienceMode: 'categorias', categories: ['Dados & Inteligência'], startDate: '2026-08-20', endDate: '2026-08-27', noEndDate: false, status: 'Ativo', updatedBy: 'Camila Nunes', updatedAt: '20/08/2026 11:05' },
      { id: 'atualizacao-banco-horas', title: 'Atualização do Banco de Horas', type: 'Novidade', audienceMode: 'produtos', products: ['Banco de Horas'], startDate: '2026-08-10', endDate: '2026-08-17', noEndDate: false, status: 'Encerrado', updatedBy: 'Diego Prado', updatedAt: '17/08/2026 08:00' },
      { id: 'rascunho-financeiro', title: 'Ajuste no Painel Financeiro', type: 'Informação', audienceMode: 'produtos', products: ['Painel Financeiro'], startDate: '', endDate: '', noEndDate: true, status: 'Rascunho', updatedBy: 'Ana Ferreira', updatedAt: '26/08/2026 08:30' },
    ],
    filters: { search: '', status: [], type: [] },
  };

  ns() { return window.DesignSystem_25dd5c || {}; }
  icon(name) { const Cmp = this.ns()[name]; return Cmp ? React.createElement(Cmp) : null; }
  noop = () => {};
  goHome = () => { window.location.href = '../portal-home/PortalHome.dc.html'; };
  toggleSidebarCollapsed = () => this.setState((s) => ({ sidebarCollapsed: !s.sidebarCollapsed }));
  handleLogout = () => { window.location.href = '../login-flow/LoginFlow.dc.html'; };
  goNovo = () => { window.location.href = '../admin-comunicados-novo/AdminComunicadoNovo.dc.html'; };
  goDetail = (id) => { window.location.href = '../admin-comunicados-detalhe/AdminComunicadoDetalhe.dc.html?noticeId=' + encodeURIComponent(id); };
  onRowClick = (row) => this.goDetail(row.id);

  onSearchChange = (v) => this.setState((s) => ({ filters: { ...s.filters, search: v } }));
  onStatusChange = (v) => this.setState((s) => ({ filters: { ...s.filters, status: v } }));
  onTypeChange = (v) => this.setState((s) => ({ filters: { ...s.filters, type: v } }));
  clearFilters = () => this.setState({ filters: { search: '', status: [], type: [] } });

  renderVals() {
    const ns = this.ns();
    const f = this.state.filters;
    const notices = this.state.notices;

    const filteredRows = notices.filter((n) =>
      (!f.search || n.title.toLowerCase().includes(f.search.toLowerCase())) &&
      (!f.status.length || f.status.includes(n.status)) &&
      (!f.type.length || f.type.includes(n.type))
    );

    const columns = [
      { key: 'title', header: 'Título', minWidth: 220 },
      { key: 'type', header: 'Tipo', minWidth: 130, render: (r) => React.createElement(ns.StatusBadge, { label: r.type, tone: TYPE_TONE[r.type] || 'neutral' }) },
      { key: 'audience', header: 'Público', minWidth: 150, render: (r) => AUDIENCE_LABEL(r) },
      { key: 'vigencia', header: 'Vigência', mono: true, minWidth: 190, render: (r) => VIGENCIA_LABEL(r) },
      { key: 'status', header: 'Status', minWidth: 120, render: (r) => React.createElement(ns.StatusBadge, { label: r.status, tone: STATUS_TONE[r.status] || 'neutral' }) },
      { key: 'updatedBy', header: 'Atualizado por', minWidth: 150 },
      { key: 'actions', header: 'Ações', align: 'right', minWidth: 60, lockWidth: true, render: (r) => React.createElement(ns.ActionOverflowMenu, { items: [
        { label: 'Ver detalhes', onClick: () => this.goDetail(r.id) },
        { label: 'Editar', onClick: () => { window.location.href = '../admin-comunicados-novo/AdminComunicadoNovo.dc.html?mode=editar&noticeId=' + encodeURIComponent(r.id); } },
        ...(r.status !== 'Encerrado' ? [{ label: 'Encerrar comunicado', tone: 'negative', onClick: () => this.goDetail(r.id) }] : []),
      ] }) },
    ];

    const activeFilterChips = [
      ...(f.search ? [{ label: 'Busca', value: f.search, onRemove: () => this.onSearchChange('') }] : []),
      ...f.status.map((v) => ({ label: 'Status', value: v, onRemove: () => this.onStatusChange(f.status.filter((x) => x !== v)) })),
      ...f.type.map((v) => ({ label: 'Tipo', value: v, onRemove: () => this.onTypeChange(f.type.filter((x) => x !== v)) })),
    ];

    return {
      kpiActive: String(notices.filter((n) => n.status === 'Ativo').length), kpiActiveSecondary: 'exibidos agora',
      kpiScheduled: String(notices.filter((n) => n.status === 'Agendado').length), kpiScheduledSecondary: 'a iniciar',
      kpiEnding: String(notices.filter((n) => n.status === 'Ativo' && n.endDate && n.endDate <= '2026-09-01').length), kpiEndingSecondary: 'nos próximos 7 dias',

      filters: f, onSearchChange: this.onSearchChange, onStatusChange: this.onStatusChange, onTypeChange: this.onTypeChange,
      statusOptions: ['Ativo', 'Agendado', 'Encerrado', 'Rascunho'],
      typeOptions: ['Informação', 'Novidade', 'Manutenção'],
      hasActiveFilters: activeFilterChips.length > 0, activeFilterChips, clearFilters: this.clearFilters,

      columns, filteredRows, rowKey: (r) => r.id, onRowClick: this.onRowClick, hasResults: filteredRows.length > 0,

      goNovo: this.goNovo, noop: this.noop,
      topbarUser: { name: 'Ana Ferreira', role: 'Administrador · Planejamento Analytics' },
      sidebarCollapsed: this.state.sidebarCollapsed, toggleSidebarCollapsed: this.toggleSidebarCollapsed,
      handleLogout: this.handleLogout,
      logoutLabel: this.state.sidebarCollapsed ? '⏻' : 'Sair',
      sidebarLogo: React.createElement('span', { onClick: this.goHome, style: { cursor: 'pointer', display: 'contents' } },
        this.state.sidebarCollapsed
          ? React.createElement('img', { src: '../../assets/logos/nexo-icon.svg', alt: 'Nexo', style: { display: 'block', width: 32, height: 32, objectFit: 'contain', flexShrink: 0 } })
          : React.createElement('img', { src: '../../assets/logos/nexo-logo-completa.svg', alt: 'Nexo', style: { display: 'block', height: 40, width: 'auto', objectFit: 'contain', flexShrink: 0 } })),
      sidebarItems: [
        { label: 'Voltar ao Nexo', icon: this.icon('IconChevronLeft'), onClick: this.goHome },
        { section: 'ADMINISTRAÇÃO', divider: true },
        { label: 'Produtos', icon: this.icon('IconNavStructure'), onClick: () => { window.location.href = '../admin-produtos/AdminProdutos.dc.html'; } },
        { label: 'Acessos', icon: this.icon('IconNavGovernance'), onClick: () => { window.location.href = '../admin-acessos/AdminAcessos.dc.html'; } },
        { label: 'Publicações', icon: this.icon('IconCalendar'), onClick: () => { window.location.href = '../admin-publicacoes/AdminPublicacoes.dc.html'; } },
        { label: 'Auditoria', icon: this.icon('IconNavGlossary'), onClick: () => { window.location.href = '../admin-auditoria/AdminAuditoria.dc.html'; } },
        { label: 'Utilização', icon: this.icon('IconNavCapacity'), onClick: () => { window.location.href = '../admin-utilizacao/AdminUtilizacao.dc.html'; } },
        { label: 'Saúde', icon: this.icon('IconDataState'), onClick: () => { window.location.href = '../admin-saude/AdminSaude.dc.html'; } },
        { label: 'Comunicados', icon: this.icon('IconBell'), active: true },
      ],
    };
  }
}

</script>
</body>
</html>
