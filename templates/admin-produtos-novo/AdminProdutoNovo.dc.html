<!-- @template name="Admin · Novo produto" description="Composição única (ProductFormTemplate) para criar e editar produtos do Nexo — mode='create' (rota /admin/produtos/novo) ou mode='edit' (?mode=edit&id=) via query string. Mesma FormFormSection/campos/handlers para os dois modos; nenhuma tela ou CSS duplicados." -->
<!--
  ProductFormTemplate contract (this file IS the shared composition — there is
  no separate "editar" screen and none should be created):
    mode         "create" | "edit"   — derived from ?mode=edit, drives title/CTA/lifecycle only
    productData  the record loaded from `catalog` for the given ?id in edit mode
    onSave       handleSave() — same function for both modes
    onCancel     goCancel()   — same function for both modes
  Any change to a FormFormSection/Field/InputText/FormSlugField/etc. below applies
  to both Novo Produto and Editar Produto automatically — do not fork this file.
-->
