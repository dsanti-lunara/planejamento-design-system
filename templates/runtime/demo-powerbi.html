<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--font-sans:"Plus Jakarta Sans",Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--bg:#fff;--surface-subtle:#f5f7fb;--text:#1a2233;--text-secondary:#6b7690;--border:#e4e8f1;--accent:#6b4fd8}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text)}
.report{min-height:100vh;display:flex;flex-direction:column}
.canvas{flex:1;display:flex;flex-direction:column;padding:20px 24px}
.tag{align-self:flex-start;font-family:var(--font-mono);font-size:10px;letter-spacing:.02em;color:var(--text-secondary);background:var(--surface-subtle);border:1px solid var(--border);border-radius:5px;padding:3px 8px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.visual{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--surface-subtle)}
.visual h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--text-secondary)}
.stripe{height:110px;border-radius:6px;background:repeating-linear-gradient(135deg,#efe9fb,#efe9fb 8px,#f7f4fc 8px,#f7f4fc 16px)}
.big{grid-column:span 2}
.big .stripe{height:220px}
.pagebar{height:36px;border-top:1px solid var(--border);display:flex;align-items:center;gap:4px;padding:0 16px;flex-shrink:0;background:var(--bg)}
.pagebtn{height:26px;border:0;background:transparent;color:var(--text-secondary);font-size:12px;padding:0 10px;border-radius:5px;cursor:pointer}
.pagebtn:hover{background:var(--surface-subtle)}
.pagebtn.active{background:var(--surface-subtle);color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main class="report">
<section class="canvas">
<span class="tag" id="ctxTag">power bi embedded — mock</span>
<div class="grid">
<article class="visual"><h3 id="kpi1">Indicador 1</h3><div class="stripe"></div></article>
<article class="visual"><h3>Indicador 2</h3><div class="stripe"></div></article>
<article class="visual"><h3>Indicador 3</h3><div class="stripe"></div></article>
</div>
<div class="grid">
<article class="visual big"><h3>Tendência</h3><div class="stripe"></div></article>
<article class="visual"><h3>Distribuição</h3><div class="stripe"></div></article>
</div>
</section>
<nav class="pagebar" id="pagebar"></nav>
</main>
<script>
const params = new URLSearchParams(location.search);
const report = params.get("report") || "Relatório";
const defaultPage = params.get("page") || "Visão Geral";
document.querySelector("#ctxTag").textContent = "power bi embedded — mock · " + report;
document.querySelector("#kpi1").textContent = defaultPage + " · Indicador 1";
const pages = [...new Set([defaultPage, "Detalhamento", "Anexos"])];
const bar = document.querySelector("#pagebar");
let current = defaultPage;
function render() {
  bar.innerHTML = "";
  pages.forEach((p) => {
    const b = document.createElement("button");
    b.className = "pagebtn" + (p === current ? " active" : "");
    b.textContent = p;
    b.addEventListener("click", () => { current = p; render(); });
    bar.appendChild(b);
  });
}
render();
</script>
</body>
</html>
