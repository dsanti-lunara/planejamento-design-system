<!-- @dsCard group="Components" viewport="960x1180" name="WaterfallChart" subtitle="Bridge chart — esteira/impact breakdowns" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--color-bg); color: var(--text-heading); padding: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { WaterfallChart, Card, Alert, IconButton, RadioGroup, Select } = window.NocHiveDesignSystem_e77885;
const TrendIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--nh-blue-600)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M3 17l6-6 4 4 8-8" /><path d="M17 5h4v4" />
  </svg>
);
const KebabIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="12" cy="19" r="1.8" /></svg>
);
function Demo() {
  const [turno, setTurno] = React.useState('todos');
  const [intervalo, setIntervalo] = React.useState('Todos');
  return (
    <div style={{display:'flex', flexDirection:'column', gap:16, maxWidth:920}}>
      <Card
        icon={<TrendIcon />}
        title={<div><div style={{fontSize:19, fontWeight:800}}>Esteira NS: impacto no intervalo</div><div style={{fontSize:13, fontWeight:400, color:'var(--text-muted)', marginTop:2}}>Visualização do impacto acumulado entre NS Forecast e NS Real</div></div>}
        action={<IconButton label="Mais opções"><KebabIcon /></IconButton>}
      >
        <WaterfallChart
          yAxisLabel="NS (%)"
          items={[
            { label: 'NS Forecast', value: 86.6, isTotal: true },
            { label: 'Dinâmica de fila', value: -7.2 },
            { label: 'HC', value: 4.2, description: 'Aumento de headcount e melhor alocação de pessoas.', detailHref: '#' },
            { label: 'TMO', value: 1.7 },
            { label: 'Volume', value: 0.4 },
            { label: 'NS Real', value: 85.7, isTotal: true },
          ]}
        />
      </Card>
      <Alert tone="info">
        O NS Real é o resultado do NS Forecast após os impactos e ganhos ao longo do intervalo analisado.
      </Alert>
      <p style={{fontSize:12, color:'var(--text-faint)', margin:0}}>
        O componente é só a esteira acima — sem filtros próprios. Uma tela real decide o que precisa
        (turno, intervalo, segmento…) e monta essa parte com os componentes de filtro já existentes
        no sistema (<code>RadioGroup</code>, <code>Select</code>, <code>FilterBar</code>…).
      </p>
      <Card title="Com filtros compostos ao lado (exemplo — não faz parte do componente)">
        <div style={{display:'flex', alignItems:'center', gap:20, flexWrap:'wrap', marginBottom:18, paddingBottom:16, borderBottom:'1px solid var(--nh-line-100)'}}>
          <RadioGroup
            direction="horizontal"
            name="turno"
            value={turno}
            onChange={setTurno}
            options={[{value:'todos', label:'Todos'},{value:'madrugada', label:'Madrugada'},{value:'manha', label:'Manhã'},{value:'tarde', label:'Tarde'},{value:'noite', label:'Noite'}]}
          />
          <Select label="Intervalo" labelPosition="left" size="sm" options={['Todos', '00:00–08:00', '08:00–16:00', '16:00–00:00']} value={intervalo} onChange={(e) => setIntervalo(e.target.value)} style={{minWidth:150, marginLeft:'auto'}} />
        </div>
        <WaterfallChart
          yAxisLabel="NS (%)"
          items={[
            { label: 'NS Forecast', value: 86.6, isTotal: true },
            { label: 'Dinâmica de fila', value: -7.2 },
            { label: 'Segmentos desalinhados', value: -1.8 },
            { label: 'NS após fila (subtotal)', value: 77.6, isTotal: true },
            { label: 'HC produtivo adicional', value: 4.2 },
            { label: 'TMO', value: 1.7 },
            { label: 'Volume atendido', value: 0.4 },
            { label: 'NS Real', value: 83.9, isTotal: true },
          ]}
          showGroupLabels
        />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
