<!-- @dsCard group="Components" viewport="700x480" name="Actions" subtitle="Button, icon buttons, overflow menu, favorite, dropdown, popover — all real click handlers" -->
<link rel="stylesheet" href="../../styles.css">
<div id="r" style="padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--color-surface-page)"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, ActionIconButtonPrimary, ActionIconButtonSecondary, ActionIconButtonGhost, ActionIconButtonDanger, ActionOverflowMenu, ActionFavorite, ActionPopover, ActionDropdownMenu } = window.DesignSystem_25dd5c;
function Row({children}){ return <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>{children}</div>; }
function App(){
  const [log, setLog] = React.useState('—');
  return <>
    <Row><Button label="Aplicar filtros" style2="primary" onClick={()=>setLog('Aplicar filtros')}/><Button label="Exportar" style2="secondary" onClick={()=>setLog('Exportar')}/><Button label="Cancelar" style2="tertiary"/><Button label="Excluir" style2="destructive"/><Button label="Sugerir com IA" style2="ai"/></Row>
    <Row><Button label="Aplicar" style2="primary" size="compact"/><Button label="Aplicar" style2="primary" state="disabled"/><Button label="Aplicar" style2="primary" state="loading"/></Row>
    <Row><ActionIconButtonPrimary size="sm" onClick={()=>setLog('Icon Primary')}/><ActionIconButtonSecondary size="md" onClick={()=>setLog('Icon Secondary')}/><ActionIconButtonGhost size="lg" onClick={()=>setLog('Icon Ghost')}/><ActionIconButtonDanger size="md" onClick={()=>setLog('Icon Danger')}/><ActionIconButtonGhost size="md" state="disabled"/></Row>
    <Row>
      <ActionOverflowMenu items={[{label:'Editar', onClick:()=>setLog('Editar')},{label:'Duplicar', onClick:()=>setLog('Duplicar')},{label:'Excluir', tone:'negative', onClick:()=>setLog('Excluir')}]}/>
      <ActionFavorite onToggle={(v)=>setLog('Favorito: '+v)}/>
      <ActionDropdownMenu items={[{label:'Editar', onClick:()=>setLog('Menu: Editar')},{label:'Arquivar', onClick:()=>setLog('Menu: Arquivar')}]}/>
    </Row>
    <Row><ActionPopover title="Sincronização" description="Última atualização há 4 minutos"/></Row>
    <Row><span style={{fontSize:12,color:'var(--color-text-muted)',fontFamily:'var(--font-mono)'}}>último clique: {log}</span></Row>
  </>;
}
ReactDOM.createRoot(document.getElementById('r')).render(<App/>);
</script>
